<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="navbar">
        <h2>Panel Admin</h2>
        <div>
            <span id="user-info"></span>
            <button onclick="logout()">Salir</button>
        </div>
    </div>
    
    <div class="container">
        <div class="card">
            <h3>Crear Empleado</h3>
            <form id="create-employee-form">
                <div class="form-group">
                    <label>Nombre de Usuario:</label>
                    <input type="text" id="new-username" required>
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="new-password" required>
                </div>
                <button type="submit">Crear Empleado</button>
            </form>
        </div>

        <div class="card mt-4">
            <h3>Lista de Empleados</h3>
            <ul id="employee-list" class="list"></ul>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        checkAuth('admin');

        function loadEmployees() {
            const usuarios = getUsuarios();
            const list = document.getElementById('employee-list');
            list.innerHTML = '';
            
            usuarios.filter(u => u.role === 'empleado').forEach(u => {
                const li = document.createElement('li');
                li.textContent = u.username;
                list.appendChild(li);
            });
        }

        document.getElementById('create-employee-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const userIn = document.getElementById('new-username').value;
            const passIn = document.getElementById('new-password').value;
            
            const usuarios = getUsuarios();
            if (usuarios.find(u => u.username === userIn)) {
                alert('El usuario ya existe');
                return;
            }

            usuarios.push({
                username: userIn,
                password: passIn,
                role: 'empleado'
            });

            saveUsuarios(usuarios);
            alert('Empleado creado con éxito');
            
            document.getElementById('create-employee-form').reset();
            loadEmployees();
        });

        loadEmployees();
    </script>
</body>
</html>
